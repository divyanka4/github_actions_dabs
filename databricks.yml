# This is a Declarative Automation Bundle definition for dabs_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabs_project
  uuid: 4667384a-a4cb-4c57-81cf-3edcae4a560a

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    mode: development
    default: true
    workspace:
      host: https://dbc-09bdc850-08ea.cloud.databricks.com
    variables:
      catalog: dev
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-09bdc850-08ea.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/paldivya0222@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/be9a2f2a-2586-4127-8138-4bdc62efebb4/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: bronze
    permissions:
      - user_name: paldivya0222@gmail.com
        level: CAN_MANAGE
      - service_principal_name: be9a2f2a-2586-4127-8138-4bdc62efebb4
        level: CAN_MANAGE
    run_as:
      service_principal_name: be9a2f2a-2586-4127-8138-4bdc62efebb4
